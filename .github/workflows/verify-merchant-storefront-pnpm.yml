name: Verify merchant storefront pnpm deployment

on:
  push:
    branches:
      - fix/merchant-storefront-vercel-workspace

permissions:
  contents: write

jobs:
  verify-pnpm-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/merchant-storefront-vercel-workspace
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install using the committed frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Confirm Next.js is resolved from the merchant app
        run: pnpm --filter @ray/merchant-storefront exec next --version

      - name: Typecheck merchant storefront with pnpm
        run: pnpm --filter @ray/merchant-storefront typecheck

      - name: Build merchant storefront with pnpm
        run: pnpm --filter @ray/merchant-storefront build
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_APP_COMMIT_SHA: ${{ github.sha }}

      - name: Remove this one-time verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-merchant-storefront-pnpm.yml
          git commit -m "chore: remove temporary pnpm verification workflow"
          git push
