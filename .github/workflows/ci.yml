name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend – lint, typecheck, tests & builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate shared package
        run: npm run typecheck --workspace=@ray-eg/shared
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Build marketplace
        run: npm run build:marketplace
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_APP_COMMIT_SHA: ${{ github.sha }}
      - name: Build dashboard
        run: npm run build:dashboard-web
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_APP_COMMIT_SHA: ${{ github.sha }}

  rendering-e2e:
    name: Published rendering E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # ubuntu-latest runners intermittently fail to resolve the Ubuntu
        # archives (runner DNS flake), which kills `install-deps` even though
        # every library is already present. Retry apt a few times; if it still
        # fails, verify the required libraries via dpkg instead of failing CI.
        run: |
          npx playwright install chromium
          ok=0
          for attempt in 1 2 3; do
            if sudo npx playwright install-deps chromium; then
              ok=1
              break
            fi
            echo "apt attempt $attempt failed (likely runner DNS flake); retrying in 15s..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::playwright install-deps kept failing; verifying required libraries are already installed"
            missing=0
            for pkg in libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xvfb fonts-noto-color-emoji libfontconfig1 libfreetype6; do
              if ! dpkg -s "$pkg" >/dev/null 2>&1; then
                echo "Missing Playwright system dependency: $pkg"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "All required libraries are already installed — continuing."
          fi
      - name: Test smoke and responsive published fixtures
        # commerce.spec.ts is intentionally excluded: it mutates a dev merchant
        # through a dev-login API instead of using an isolated test fixture.
        run: npm run e2e -- e2e/smoke.spec.ts e2e/responsive-template.spec.ts e2e/checkout.spec.ts
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4179
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_APP_COMMIT_SHA: ${{ github.sha }}
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rendering-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  gobackend:
    name: Go Backend – migrations, integration, vet, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ray_orders_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ray_orders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./gobackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gobackend/go.mod
          cache-dependency-path: gobackend/go.sum
      - run: go mod download
      - name: Apply migrations to the disposable database
        run: go run scripts/migrate.go up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ray_orders_test?sslmode=disable
          FRONTEND_APP_URL: http://localhost:5174
          JWT_SECRET: ci-only-order-test-secret
      - name: Report test schema version
        run: go run scripts/migrate.go version
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ray_orders_test?sslmode=disable
          FRONTEND_APP_URL: http://localhost:5174
          JWT_SECRET: ci-only-order-test-secret
      - run: go vet ./...
      - name: Run backend tests and fresh-database migration integration
        run: go test -v ./cmd/... ./internal/...
        env:
          ORDERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ray_orders_test?sslmode=disable
      - run: go build -o /tmp/ray-api ./cmd/api
      - run: go build -o /tmp/ray-worker ./cmd/worker
