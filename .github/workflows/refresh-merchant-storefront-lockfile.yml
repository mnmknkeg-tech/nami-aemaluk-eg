name: Refresh merchant storefront pnpm lockfile

on:
  push:
    branches:
      - fix/merchant-storefront-vercel-workspace

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/merchant-storefront-vercel-workspace
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate and validate workspace lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q '^  apps/merchant-storefront:' pnpm-lock.yaml
          grep -A4 '^  apps/merchant-storefront:' pnpm-lock.yaml | grep -q 'link:../../packages/shared'

      - name: Commit generated lockfile and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/refresh-merchant-storefront-lockfile.yml
          git commit -m "fix: regenerate compatible pnpm workspace lockfile"
          git push
